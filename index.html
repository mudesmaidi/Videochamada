<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chamada de Vídeo</title>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        html, body {
            width: 100%;
            height: 100%;
            font-family: Arial, sans-serif;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #6e7df2, #a1a9f7 );
            transition: background 0.5s ease;
        }

        #invite-screen {
            text-align: center;
            padding: 20px;
            width: 100%;
            max-width: 400px;
            z-index: 5;
        }

        .container-box {
            background: #ffffff;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
        }

        h1 { font-size: 20px; margin-bottom: 15px; color: #333; line-height: 1.4; }
        p { font-size: 16px; margin-bottom: 25px; color: #666; }

        .button {
            background-color: #4e54c8;
            color: white;
            font-size: 18px;
            font-weight: bold;
            padding: 15px 30px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            text-decoration: none;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .loading-text {
            font-size: 18px;
            font-weight: bold;
            color: #4e54c8;
        }

        #video-screen {
            display: none;
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            background-color: #ffffff;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }

        video {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            background-color: #ffffff;
        }

        .live-badge {
            position: absolute;
            top: 20px;
            right: 20px;
            background-color: #ff0000;
            color: white;
            padding: 6px 14px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 12px;
            z-index: 20;
            text-transform: uppercase;
            box-shadow: 0 0 10px rgba(255,0,0,0.3);
        }
    </style>
</head>
<body>

    <!-- TELA 1 -->
    <div id="invite-screen">
        <div class="container-box" id="invite-content">
            <h1>Geovana convidou você para uma chamada de vídeo ao vivo...</h1>
            <p>Clique no botão abaixo para aceitar o convite 👇</p>
            <button class="button" id="joinButton">Participar agora</button>
        </div>
    </div>

    <!-- TELA 2 -->
    <div id="video-screen">
        <div class="live-badge">Ao Vivo</div>
        <video id="meuVideo" muted loop playsinline>
            <source src="https://res.cloudinary.com/dhcffmlqh/video/upload/v1773625361/videochamada_mdzzef.mp4" type="video/mp4">
        </video>
    </div>

    <script>
        const inviteScreen = document.getElementById('invite-screen');
        const videoScreen = document.getElementById('video-screen');
        const inviteContent = document.getElementById('invite-content');
        const joinButton = document.getElementById('joinButton');
        const video = document.getElementById('meuVideo');

        // TRAVA: já acessou antes
        if (localStorage.getItem('videoCallAccessed')) {
            inviteContent.innerHTML = `<h1>Essa chamada de vídeo já terminou...</h1>`;
            joinButton.style.display = 'none';
        }

        joinButton.addEventListener('click', () => {
            startLoading();
        });

        function startLoading() {
            const messages = [
                "Confirmando conexão...",
                "Geovana está online agora...",
                "Entrando na sala ao vivo..."
            ];
            let i = 0;

            inviteContent.innerHTML = `<div class="loading-text">${messages[i]}</div>`;

            const interval = setInterval(() => {
                i++;
                if (i < messages.length) {
                    inviteContent.innerHTML = `<div class="loading-text">${messages[i]}</div>`;
                } else {
                    clearInterval(interval);
                    showVideo();
                }
            }, 1500);
        }

        function showVideo() {
            document.body.style.background = "#ffffff";
            inviteScreen.style.display = 'none';
            videoScreen.style.display = 'flex';

            video.play().catch(e => console.log("Erro ao dar play:", e));

            fbq('track', 'Lead');

            fbq('track', 'Purchase', {
                value: 1.00,
                currency: 'BRL',
                content_name: 'Acesso_Videochamada',
                content_category: 'Conteudo_Exclusivo',
                num_items: 1
            });

            // MARCA COMO JÁ ACESSADO
            localStorage.setItem('videoCallAccessed', 'true');
        }
    </script>

</body>
</html>
