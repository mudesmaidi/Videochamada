<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chamada de Vídeo</title>

    <!-- Facebook Pixel Code -->
    <script>
    !function(f,b,e,v,n,t,s)
    {if(f.fbq)return;n=f.fbq=function(){n.callMethod?
    n.callMethod.apply(n,arguments):n.queue.push(arguments)};
    if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
    n.queue=[];t=b.createElement(e);t.async=!0;
    t.src=v;s=b.getElementsByTagName(e)[0];
    s.parentNode.insertBefore(t,s)}(window, document,'script',
    'https://connect.facebook.net/en_US/fbevents.js' );
    fbq('init', '1245756120497473'); 
    fbq('track', 'PageView');
    </script>
    <noscript><img height="1" width="1" style="display:none"
    src="https://www.facebook.com/tr?id=1245756120497473&ev=PageView&noscript=1"
    /></noscript>
    <!-- End Facebook Pixel Code -->

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        html, body {
            width: 100%;
            height: 100%;
            background-color: #ffffff !important;
            font-family: Arial, sans-serif;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Estilo da Tela de Convite */
        #invite-screen {
            text-align: center;
            padding: 20px;
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container-box {
            background: #ffffff;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1 );
        }

        h1 { font-size: 22px; margin-bottom: 15px; color: #333; }
        p { font-size: 16px; margin-bottom: 25px; color: #666; }

        .button {
            background-color: #25d366;
            color: white;
            font-size: 18px;
            font-weight: bold;
            padding: 15px 40px;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            text-decoration: none;
            box-shadow: 0 4px 15px rgba(37, 211, 102, 0.3);
        }

        .loading-text {
            font-size: 18px;
            font-weight: bold;
            color: #25d366;
            margin-top: 20px;
        }

        /* Estilo da Tela do Vídeo (Escondida inicialmente) */
        #video-screen {
            display: none;
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            background-color: #ffffff;
            justify-content: center;
            align-items: center;
        }

        video {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            background-color: #ffffff;
        }

        .live-badge {
            position: absolute;
            top: 20px;
            right: 20px;
            background-color: #ff0000;
            color: white;
            padding: 6px 14px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 12px;
            z-index: 10;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

    <!-- TELA 1: CONVITE -->
    <div id="invite-screen">
        <div class="container-box" id="invite-content">
            <h1>Geovana convidou você para uma chamada de vídeo ao vivo...</h1>
            <p>Clique no botão abaixo para aceitar o convite 👇</p>
            <button class="button" id="joinButton">Participar agora</button>
        </div>
    </div>

    <!-- TELA 2: VÍDEO (Fica oculta até o clique) -->
    <div id="video-screen">
        <div class="live-badge">Ao Vivo</div>
        <video id="meuVideo" muted loop playsinline>
            <source src="https://res.cloudinary.com/dhcffmlqh/video/upload/v1773625361/videochamada_mdzzef.mp4" type="video/mp4">
        </video>
    </div>

    <script>
        const inviteScreen = document.getElementById('invite-screen' );
        const videoScreen = document.getElementById('video-screen');
        const inviteContent = document.getElementById('invite-content');
        const joinButton = document.getElementById('joinButton');
        const video = document.getElementById('meuVideo');

        joinButton.addEventListener('click', () => {
            startLoading();
        });

        function startLoading() {
            const messages = [
                "Confirmando conexão...",
                "Geovana está online agora...",
                "Entrando na sala ao vivo..."
            ];
            let i = 0;

            // Mostra o carregamento
            inviteContent.innerHTML = `<div class="loading-text">${messages[i]}</div>`;

            const interval = setInterval(() => {
                i++;
                if (i < messages.length) {
                    inviteContent.innerHTML = `<div class="loading-text">${messages[i]}</div>`;
                } else {
                    clearInterval(interval);
                    showVideo();
                }
            }, 1500);
        }

        function showVideo() {
            // Esconde o convite e mostra o vídeo
            inviteScreen.style.display = 'none';
            videoScreen.style.display = 'flex';
            
            // Inicia o vídeo
            video.play().catch(e => console.log("Erro ao dar play:", e));
            
            // Envia evento de conversão para o Facebook (opcional)
            if(typeof fbq !== 'undefined') {
                fbq('track', 'Lead'); // Rastreia como se a pessoa tivesse aceitado o convite
            }
        }
    </script>

</body>
</html>
