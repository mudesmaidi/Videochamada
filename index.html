<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chamada de Vídeo</title>

    <style>
        /* Reset total para preencher a tela */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Fundo branco obrigatório em toda a página */
        html, body {
            width: 100%;
            height: 100%;
            background-color: #ffffff !important;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
        }

        .video-container {
            position: relative;
            width: 100%;
            height: 100%;
            background-color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        video {
            /* Ajuste responsivo: preenche no celular e centraliza no PC */
            max-width: 100%;
            max-height: 100%;
            width: auto;
            height: auto;
            object-fit: contain;
            background-color: #ffffff;
            
            /* Melhora a nitidez da imagem */
            image-rendering: -webkit-optimize-contrast;
            image-rendering: crisp-edges;
        }

        /* Selo "Ao Vivo" no canto superior direito */
        .live-badge {
            position: absolute;
            top: 20px;
            right: 20px;
            background-color: #ff0000;
            color: white;
            padding: 6px 14px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 14px;
            box-shadow: 0 0 15px rgba(255, 0, 0, 0.4 );
            z-index: 10;
            text-transform: uppercase;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div class="video-container">
        <!-- Selo de indicação de live -->
        <div class="live-badge">Ao Vivo</div>
        
        <!-- 
            autoplay: Inicia sozinho
            muted: Obrigatório para o autoplay funcionar
            loop: Repete o vídeo
            playsinline: Essencial para iPhone/Safari
            (Sem o atributo 'controls' para remover o play do quadrado)
        -->
        <video 
            id="videoChamada"
            autoplay 
            muted 
            loop 
            playsinline
        >
            <source src="https://res.cloudinary.com/dhcffmlqh/video/upload/v1773625361/videochamada_mdzzef.mp4" type="video/mp4">
            Seu navegador não suporta vídeos.
        </video>
    </div>

    <script>
        // Garante que o vídeo comece a rodar assim que carregar
        window.addEventListener('load', function( ) {
            var video = document.getElementById('videoChamada');
            video.play().catch(function(e) { 
                console.log("O navegador bloqueou o início automático:", e); 
            });
        });
    </script>

</body>
</html>
