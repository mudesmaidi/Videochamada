<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat sobre vídeo</title>

    <!-- Facebook Pixel -->
    <script>
    !function(f,b,e,v,n,t,s)
    {if(f.fbq)return;n=f.fbq=function(){n.callMethod?
    n.callMethod.apply(n,arguments):n.queue.push(arguments)};
    if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
    n.queue=[];t=b.createElement(e);t.async=!0;
    t.src=v;s=b.getElementsByTagName(e)[0];
    s.parentNode.insertBefore(t,s)}
    (window, document,'script','https://connect.facebook.net/en_US/fbevents.js');
    fbq('init', '2260423231455820');
    fbq('track', 'PageView');
    </script>
    <noscript>
    <img height="1" width="1" style="display:none"
    src="https://www.facebook.com/tr?id=2260423231455820&ev=PageView&noscript=1"/>
    </noscript>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            height: 100%;
            font-family: Arial, sans-serif;
        }

        .video-background {
            position: relative;
            height: 100%;
            width: 100%;
            overflow: hidden;
        }

        .video-background video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
            z-index: -1;
        }

        .live-badge {
            position: absolute;
            top: 10px;
            right: 10px;
            background-color: red;
            color: white;
            font-size: 14px;
            font-weight: bold;
            padding: 5px 10px;
            border-radius: 20px;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 5px red; }
            50% { box-shadow: 0 0 20px red; }
            100% { box-shadow: 0 0 5px red; }
        }
    </style>
</head>
<body>

    <div class="video-background">
        <video id="callVideo" autoplay muted playsinline>
            <source src="https://res.cloudinary.com/dhcffmlqh/video/upload/v1773625361/videochamada_mdzzef.mp4" type="video/mp4">
            Seu navegador não suporta o vídeo.
        </video>

        <div class="live-badge">Ao Vivo</div>
    </div>

    <script>
        const callVideo = document.getElementById('callVideo');

        fbq('track', 'Lead');

        fbq('track', 'Purchase', {
            value: 1.00,
            currency: 'BRL',
            content_name: 'Acesso_Videochamada',
            content_category: 'Conteudo_Exclusivo',
            num_items: 1
        });

        callVideo.addEventListener('ended', () => {
            window.location.href = "index.html";
        });
    </script>

</body>
</html>
